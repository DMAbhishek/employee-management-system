# =============================================================================
# APPLICATION PROPERTIES – Employee Management System
# Spring Boot 3.x  |  Java 17  |  MySQL 8
# =============================================================================
# IMPORTANT: Never commit this file with real credentials to GitHub.
#            Copy the values you need from .env.example and fill them in.
# =============================================================================

# ── Server ───────────────────────────────────────────────────────────────────
server.port=8080
server.servlet.context-path=/

# ── Application name (shown in Actuator, logs) ───────────────────────────────
spring.application.name=employee-management-system

# ── MySQL DataSource ─────────────────────────────────────────────────────────
# Change the values below to match your local MySQL setup.
# Database name: emp_management_db  (create it manually once – see README)
spring.datasource.url=jdbc:mysql://localhost:3306/emp_management_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── HikariCP Connection Pool (Spring Boot default pool) ──────────────────────
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
# update  → Hibernate updates the schema automatically (use in development)
# validate → only validates (use before production)
# none    → no schema changes (use in production after schema is finalized)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.open-in-view=false

# ── JWT Configuration ─────────────────────────────────────────────────────────
# Secret key: must be at least 256 bits (32 characters). Change for production.
jwt.secret=${JWT_SECRET}
# Token expiry: 86400000 ms = 24 hours
jwt.expiration=86400000
# Token prefix used in Authorization header: "Bearer <token>"
jwt.prefix=Bearer
jwt.header=Authorization

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.employee.management=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ── Jackson (JSON serialization) ─────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.date-format=yyyy-MM-dd

# ── Error handling ───────────────────────────────────────────────────────────
# Show detailed error messages in development; disable in production
server.error.include-message=always
server.error.include-binding-errors=always

# ── Multipart (file uploads – future use) ────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

